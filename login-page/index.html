<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Login Page</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light d-flex align-items-center py-4">
    <main class="form-signin w-100 m-auto">
        <div class="card shadow-sm rounded-4 border-0">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <h1 class="h3 mb-3 fw-bold text-primary">Welcome Back</h1>
                    <p class="text-muted">Please sign in to your account</p>
                </div>

                <form id="loginForm">
                    <div id="alertMessage" class="alert d-none" role="alert"></div>

                    <div class="form-floating mb-3">
                        <input type="email" class="form-control rounded-3" id="emailInput" placeholder="name@example.com" required>
                        <label for="emailInput">Email address</label>
                    </div>
                    
                    <div class="form-floating mb-3">
                        <input type="password" class="form-control rounded-3" id="passwordInput" placeholder="Password" required>
                        <label for="passwordInput">Password</label>
                    </div>

                    <div class="form-check mb-3 text-start">
                        <input class="form-check-input" type="checkbox" value="remember-me" id="rememberCheck">
                        <label class="form-check-label text-muted" for="rememberCheck">
                            Remember me
                        </label>
                    </div>
                    
                    <button class="w-100 btn btn-lg btn-primary rounded-pill py-2 fw-semibold shadow-sm" type="submit" id="loginBtn">
                        Sign in
                        <span class="spinner-border spinner-border-sm d-none ms-2" id="loginSpinner" role="status" aria-hidden="true"></span>
                    </button>
                </form>
            </div>
        </div>
    </main>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>
